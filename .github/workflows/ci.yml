name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.20.0"
  PNPM_VERSION: "8.15.0"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, unit-test, type-check, build]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        if: matrix.check == 'build'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        if: matrix.check == 'lint'
        run: pnpm lint

      - name: Unit tests
        if: matrix.check == 'unit-test'
        run: pnpm test:unit

      - name: Type check
        if: matrix.check == 'type-check'
        run: pnpm --filter @tendaui/theme-generator type-check

      - name: Build packages
        if: matrix.check == 'build'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            pnpm lerna run build --stream --concurrency 1
          elif git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -Eq '^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|lerna.json|rollup.config.mjs|tsconfig|config/|scripts/)'; then
            pnpm lerna run build --stream --concurrency 1
          else
            pnpm lerna run build --since "$BASE_SHA" --stream
          fi
