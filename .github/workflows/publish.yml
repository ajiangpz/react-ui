name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - beta
          - publish

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-new-version:
    name: Publish a new version
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.20.0"
          registry-url: "https://registry.npmjs.org/"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Type check
        run: pnpm --filter @tendaui/theme-generator type-check

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release settings
        id: release
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "publish" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            if [[ "$(node -p "require('./lerna.json').version")" == *-* ]]; then
              echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
            else
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event.inputs.release_type }}" = "beta" ]; then
            echo "mode=prepare" >> "$GITHUB_OUTPUT"
            echo "bump=preminor" >> "$GITHUB_OUTPUT"
            echo "preid=--preid beta" >> "$GITHUB_OUTPUT"
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "mode=prepare" >> "$GITHUB_OUTPUT"
            echo "bump=${{ github.event.inputs.release_type }}" >> "$GITHUB_OUTPUT"
            echo "preid=" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.release.outputs.mode == 'prepare'
        run: |
          pnpm lerna version "${{ steps.release.outputs.bump }}" ${{ steps.release.outputs.preid }} --exact --force-publish --yes --no-push --no-commit-hooks --message "chore(release): publish %s [skip ci]"

      - name: Build
        run: pnpm lerna run build --stream --concurrency 1

      - name: Clean generated changes
        run: |
          git restore -- packages/tendaui-icons/src/icons/index.ts

      - name: Inspect package contents
        run: |
          pnpm --filter @tendaui/icons exec npm pack --dry-run
          pnpm --filter @tendaui/react exec npm pack --dry-run
          pnpm --filter @tendaui/theme-generator exec npm pack --dry-run

      - name: Create release pull request
        if: steps.release.outputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./lerna.json').version")"
          BRANCH="release/v${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create --base "${{ github.ref_name }}" --head "${BRANCH}" --title "chore(release): publish v${VERSION}" --body "Automated release version update. Merge after all required CI checks pass."
          gh workflow run ci.yml --ref "${BRANCH}"

      - name: Push release tag
        if: steps.release.outputs.mode == 'publish'
        run: |
          VERSION="$(node -p "require('./lerna.json').version")"
          TAG="v${VERSION}"
          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "${TAG}" -m "chore(release): publish ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Upgrade npm for trusted publishing
        if: steps.release.outputs.mode == 'publish'
        run: |
          npm install --global npm@latest
          npm config get registry
          npm --version

      - name: Publish packages
        if: steps.release.outputs.mode == 'publish'
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm lerna publish from-package --dist-tag "${{ steps.release.outputs.dist_tag }}" --yes
