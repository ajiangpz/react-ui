name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - beta

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-new-version:
    name: Publish a new version
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          registry-url: "https://registry.npmjs.org/"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Type check
        run: pnpm --filter @tendaui/theme-generator type-check

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release settings
        id: release
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "beta" ]; then
            echo "bump=preminor" >> "$GITHUB_OUTPUT"
            echo "preid=--preid beta" >> "$GITHUB_OUTPUT"
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "bump=${{ github.event.inputs.release_type }}" >> "$GITHUB_OUTPUT"
            echo "preid=" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        run: |
          pnpm lerna version "${{ steps.release.outputs.bump }}" ${{ steps.release.outputs.preid }} --exact --force-publish --yes --no-push --no-commit-hooks --message "chore(release): publish %s [skip ci]"

      - name: Build
        run: pnpm lerna run build --stream

      - name: Clean generated changes
        run: |
          git restore -- packages/tendaui-icons/src/icons/index.ts

      - name: Inspect package contents
        run: |
          pnpm --filter @tendaui/icons exec npm pack --dry-run
          pnpm --filter @tendaui/react exec npm pack --dry-run
          pnpm --filter @tendaui/theme-generator exec npm pack --dry-run

      - name: Push release commit and tags
        run: git push --follow-tags --no-verify --atomic

      - name: Configure npm registry and auth token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_GITHUB_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set NPM_TOKEN or NPM_GITHUB_TOKEN in repository secrets."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc

      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_GITHUB_TOKEN }}
        run: |
          npm config get registry
          npm whoami

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm lerna publish from-package --dist-tag "${{ steps.release.outputs.dist_tag }}" --yes
